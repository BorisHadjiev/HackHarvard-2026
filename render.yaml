# Render Blueprint: landlord portal only. The tenant app stays on the demo laptop.
services:
  - type: web
    name: need-to-know
    runtime: node
    plan: free # free plan sleeps after ~15 min idle; switch to "starter" (paid) for judging if needed
    buildCommand: npm ci && npm run build -w landlord-portal
    startCommand: npm run start -w landlord-portal
    healthCheckPath: /api/requests
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TENANT_APP_PUBLIC_JWK
        sync: false
      - key: PORTAL_AUDIENCE
        sync: false
      - key: PORTAL_REQUESTER_NAME
        sync: false
      - key: TENANT_APP_URL
        sync: false
      - key: PUBLIC_PORTAL_URL
        sync: false
      - key: TRUSTED_BUILD_HASHES
        sync: false
      # Texting (optional). Without PHOTON_* the portal logs the tenant link instead of texting it.
      - key: PHOTON_API_KEY
        sync: false
      - key: PHOTON_PROJECT_ID
        sync: false
      - key: PHOTON_SENDER_ID
        sync: false
      - key: PHOTON_PLATFORM
        sync: false
      - key: PHOTON_INBOUND_SECRET
        sync: false
      # Where a texted YES tells the tenant app to send the claim. Set to this service's public URL.
      - key: PORTAL_ORIGIN
        sync: false
